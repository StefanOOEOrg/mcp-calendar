[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-calendar"
version = "0.2.0"
description = "MCP server for read-only, on-demand queries against an ICS calendar share link (e.g. Proton Calendar's public link)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StefanOOE" }]
keywords = ["mcp", "model-context-protocol", "calendar", "ics", "icalendar"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "icalendar>=6.0",
    "recurring-ical-events>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff==0.17.2"]

[project.scripts]
mcp-calendar = "mcp_calendar.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_calendar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
